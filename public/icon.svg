<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#1a1d24"/>
  <rect x="48" y="48" width="416" height="416" rx="56" fill="none" stroke="#f5a524" stroke-width="6"/>
  <!-- Coil symbol — concentric circles representing an evaporator/condenser coil -->
  <g transform="translate(256 256)">
    <circle r="148" fill="none" stroke="#f5a524" stroke-width="14"/>
    <circle r="110" fill="none" stroke="#f5a524" stroke-width="14"/>
    <circle r="72" fill="none" stroke="#f5a524" stroke-width="14"/>
    <circle r="34" fill="#f5a524"/>
    <!-- fins -->
    <g stroke="#7a828c" stroke-width="3">
      <line x1="-160" y1="0" x2="160" y2="0"/>
      <line x1="0" y1="-160" x2="0" y2="160"/>
      <line x1="-113" y1="-113" x2="113" y2="113"/>
      <line x1="-113" y1="113" x2="113" y2="-113"/>
    </g>
  </g>
  <text x="256" y="478" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="800" fill="#f5a524" text-anchor="middle" letter-spacing="8">COILSIDE</text>
</svg>
